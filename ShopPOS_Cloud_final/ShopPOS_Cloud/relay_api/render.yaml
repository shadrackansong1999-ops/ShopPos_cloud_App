# One-click Render Blueprint. In the Render dashboard: New -> Blueprint,
# point it at the repo/folder containing this file, and Render provisions
# the web service (and, if you keep the db section, a free Postgres
# instance) automatically.
services:
  - type: web
    name: shoppos-relay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shoppos-relay-db
          property: connectionString

databases:
  - name: shoppos-relay-db
    plan: free
