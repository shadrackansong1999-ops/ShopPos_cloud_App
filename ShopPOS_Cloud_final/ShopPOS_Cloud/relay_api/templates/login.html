<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopPOS Cloud - Sign In</title>
<meta name="description" content="Check your shop's sales, inventory and reports from anywhere.">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0E7C5A">
<link rel="icon" href="/static/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShopPOS">
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen safe-top safe-bottom flex items-center justify-center px-4 py-10"
      style="background:var(--bg); color:var(--text)">

  <div class="w-full max-w-sm">
    <div class="flex items-center gap-2.5 justify-center mb-7">
      <img src="/static/icons/icon-192.png" alt="" class="w-9 h-9 rounded-xl">
      <span class="font-display text-xl font-bold">ShopPOS <span style="color:var(--accent)">Cloud</span></span>
    </div>

    <div class="rounded-2xl p-7 sm:p-8" style="background:var(--card); border:1px solid var(--border)">
      <h1 class="font-display text-lg font-semibold mb-1">Sign in</h1>
      <p class="text-sm mb-6" style="color:var(--text-muted)">View your shop from anywhere</p>

      <div id="err" class="hidden text-sm rounded-lg px-3 py-2.5 mb-4"
           style="background:color-mix(in srgb, var(--coral) 14%, transparent); color:var(--coral); border:1px solid color-mix(in srgb, var(--coral) 30%, transparent)"></div>

      <form id="login-form" class="space-y-4" autocomplete="on">
        <div>
          <label for="email" class="block text-xs font-medium mb-1.5" style="color:var(--text-muted)">Owner email</label>
          <input id="email" type="email" required autocomplete="username" inputmode="email"
                 class="w-full rounded-lg px-3.5 py-2.5 text-[15px] outline-none"
                 style="background:var(--bg-alt); border:1px solid var(--border); color:var(--text)">
        </div>
        <div>
          <label for="password" class="block text-xs font-medium mb-1.5" style="color:var(--text-muted)">Password</label>
          <input id="password" type="password" required autocomplete="current-password"
                 class="w-full rounded-lg px-3.5 py-2.5 text-[15px] outline-none"
                 style="background:var(--bg-alt); border:1px solid var(--border); color:var(--text)">
        </div>
        <button id="submit-btn" type="submit"
                class="w-full rounded-lg py-3 text-[15px] font-semibold transition disabled:opacity-60"
                style="background:var(--accent); color:var(--accent-ink)">
          Sign in
        </button>
      </form>

      <p class="text-xs leading-relaxed mt-6" style="color:var(--text-muted)">
        Use the email and password you entered in ShopPOS under
        Settings, then Remote Access, when you enabled remote access.
      </p>
    </div>

    <p id="install-hint" class="hidden text-xs text-center mt-5" style="color:var(--text-muted)">
      <button id="install-btn" class="underline underline-offset-2" style="color:var(--accent)">
        Install ShopPOS Cloud on this device
      </button>
    </p>
  </div>

  <script>
    async function sha256Hex(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("err");
      const btn = document.getElementById("submit-btn");
      errEl.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Signing in...";

      try {
        const password_hash = await sha256Hex(password);
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password_hash }),
        });
        const data = await r.json();
        if (data.ok) {
          window.location.href = "/dashboard";
        } else {
          errEl.textContent = data.error || "Sign in failed";
          errEl.classList.remove("hidden");
        }
      } catch (err) {
        errEl.textContent = "Could not reach the server. Try again.";
        errEl.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });

    // Install prompt (Chrome/Edge/Android). Safari/iOS has no programmatic
    // prompt; users add it via the browser's own Share > Add to Home Screen.
    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById("install-hint").classList.remove("hidden");
    });
    document.getElementById("install-btn").addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById("install-hint").classList.add("hidden");
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
